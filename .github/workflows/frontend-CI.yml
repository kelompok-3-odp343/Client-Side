name: Frontend CI/CD

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

jobs:
  build-test-lint-analyze-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm i

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          npm run lint || echo "::warning::Linting failed, check your code style!"
        continue-on-error: true

      # - name: Run Unit Tests
      #   run: |
      #     echo "🧪 Running Unit Tests..."
      #     npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            jrtr1/wandoor-frontend-app:frontend-${{ github.sha }}
            jrtr1/wandoor-frontend-app:frontend-latest

      - name: Build Docker image (local)
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: jrtr1/wandoor-frontend-app:temp-scan

      # Verifikasi image sudah ada
      - name: Verify Docker image exists
        run: docker images | grep jrtr1/wandoor-frontend-app

      # Cache Trivy binary agar tidak download setiap run
      - name: Cache Trivy binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/trivy
          key: trivy-binary-v0.56.1-Linux-X64
          restore-keys: trivy-binary-

      # Install Trivy
      - name: Setup Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
      
      # 1. Scan Docker image (PRIORITAS UTAMA)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0  # Pin ke versi stabil
        with:
          image-ref: 'jrtr1/wandoor-frontend-app:frontend-latest'
          format: 'table'
          exit-code: '0'  # Staging: '0' (warning only) | Production: '1' (block deploy)
          ignore-unfixed: true  # Skip vuln yang belum ada patch
          vuln-type: 'os,library'  # Scan OS packages & library dependencies
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'  # Fokus ke yang paling berbahaya
          timeout: '10m0s'  # Timeout 10 menit
          scanners: 'vuln'  # Hanya scan vulnerability (skip secret/config

      # === Find & Replace image tag di repo infra ===
      - name: Checkout infra repository
        uses: actions/checkout@v3
        with:
          repository: kelompok-3-odp343/infra
          token: ${{ secrets.ACCESS_TOKEN }}
          path: infra
          ref: staging

      - name: Update image tag in frontend deployment
        run: |
          cd infra/k3s/frontend-wandoor
          sed -i "s|jrtr1/wandoor-frontend-app:.*|jrtr1/wandoor-frontend-app:frontend-${{ github.sha }}|g" frontend-deployment.yaml

      - name: Commit and push updated image tag
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update frontend image tag to frontend-${{ github.sha }}"
          git push origin staging
